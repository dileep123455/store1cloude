<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudNotes</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo-container">
      <i class="fa-solid fa-cloud logo-icon"></i>
      <h1>CloudNotes</h1>
    </div>
    <button id="logout-btn" class="btn-secondary" style="display: none;">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </header>

  <main class="main-content">
    
    <!-- Authentication Card -->
    <div id="auth-container" class="card auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="hidden">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required placeholder="Enter full name" />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label for="signup-dob">Date of Birth</label>
          <input type="date" id="signup-dob" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required placeholder="Create password" />
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
    </div>

    <!-- Notes Workspace -->
    <section id="notes-container" style="display: none;">
      
      <!-- Create Note Form -->
      <div class="card create-note-card">
        <h3><i class="fa-solid fa-pen-to-square"></i> Create Note</h3>
        <form id="note-form">
          <div class="form-group">
            <input type="text" id="note-title" placeholder="Title" required />
          </div>
          <div class="form-group">
            <textarea id="note-content" placeholder="Take a note..." rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group color-picker-group">
              <label for="note-color">Card Color</label>
              <input type="color" id="note-color" value="#1e293b" />
            </div>

            <div class="form-group file-group">
              <label for="note-file"><i class="fa-solid fa-paperclip"></i> Attach File / Image</label>
              <input type="file" id="note-file" accept="image/*,.pdf,.doc,.docx" />
            </div>
          </div>

          <button type="submit" class="btn-primary">Save Note</button>
        </form>
      </div>

      <!-- Vertical Notes Container (One by One Stack) -->
      <div id="notes-grid" class="notes-stack"></div>

    </section>

  </main>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }
  </script>

  <script src="script.js"></script>

</body>
</html>
