<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudNotes - Sync Notes Across Devices</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= AUTHENTICATION CONTAINER ================= -->
  <div id="auth-screen" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fa-solid fa-note-sticky logo-icon"></i>
        <h2>CloudNotes</h2>
        <p>Keep your notes in sync across all your devices</p>
      </div>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Log In</button>
        <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Google Sign-In Button -->
      <button class="google-btn" id="google-login-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" />
        <span>Continue with Google</span>
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="primary-btn">Log In</button>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signup-form" class="auth-form hidden">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="signup-dob">Date of Birth</label>
          <input type="date" id="signup-dob" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Create a password" required />
        </div>
        <button type="submit" class="primary-btn">Create Account</button>
      </form>

    </div>
  </div>


  <!-- ================= NOTES DASHBOARD CONTAINER ================= -->
  <div id="app-dashboard" class="dashboard-wrapper hidden">
    
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-brand">
        <i class="fa-solid fa-note-sticky"></i>
        <span>CloudNotes</span>
      </div>
      <div class="nav-user">
        <span id="user-display-name">Welcome, User</span>
        <button id="logout-btn" class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">

      <!-- Search & Filters -->
      <section class="controls-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Search notes..." />
        </div>
      </section>

      <!-- Create New Note Card -->
      <section class="create-note-card">
        <input type="text" id="note-title" placeholder="Title" class="note-title-input" />
        <textarea id="note-content" placeholder="Take a note..." rows="3" class="note-content-input"></textarea>
        
        <div class="note-card-actions">
          <div class="color-picker">
            <span class="color-dot default active" data-color="#ffffff"></span>
            <span class="color-dot red" data-color="#fef2f2"></span>
            <span class="color-dot yellow" data-color="#fefce8"></span>
            <span class="color-dot green" data-color="#f0fdf4"></span>
            <span class="color-dot blue" data-color="#eff6ff"></span>
            <span class="color-dot purple" data-color="#faf5ff"></span>
          </div>
          <button id="add-note-btn" class="add-btn">
            <i class="fa-solid fa-plus"></i> Save Note
          </button>
        </div>
      </section>

      <!-- Notes Grid -->
      <section class="notes-grid-section">
        <h3>Your Saved Notes</h3>
        <div id="notes-grid" class="notes-grid">
          
          <!-- Example Note Item 1 -->
          <div class="note-card" style="background-color: #f0fdf4;">
            <div class="note-card-header">
              <h4>Project Ideas</h4>
              <button class="pin-btn active"><i class="fa-solid fa-thumbtack"></i></button>
            </div>
            <p>Build a cross-device notes web application using Firebase Firestore.</p>
            <div class="note-card-footer">
              <span class="note-date">May 24, 2026</span>
              <div class="note-actions">
                <button class="icon-btn danger"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>

          <!-- Example Note Item 2 -->
          <div class="note-card" style="background-color: #fefce8;">
            <div class="note-card-header">
              <h4>Shopping List</h4>
              <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
            </div>
            <p>1. Apples<br>2. Milk<br>3. Bread<br>4. Coffee beans</p>
            <div class="note-card-footer">
              <span class="note-date">May 22, 2026</span>
              <div class="note-actions">
                <button class="icon-btn danger"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <!-- Inline UI Switch Script (For Testing Display) -->
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }
  </script>
  <!-- Link external JavaScript file -->
  <script type="module" src="script.js"></script>
</body>
</html>
